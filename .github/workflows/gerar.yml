# Gera uma geração completa (extrato do OpenStreetMap -> bancos por estado e base -> travas -> catálogo) e publica a
# release e o catalogo.json pelo scripts/publish.py, com todas as travas dele.
#
# A cada 29 dias: todo dia, às 03:47 e às 09:47 em Brasília, o job "interval" lê a data da geração publicada
# (built_at do catalogo.json) e só segue para a geração se ela tiver 29 dias ou mais (scripts/due.py). Se a geração
# falhar, o disparo seguinte tenta de novo: a publicada continua com a data velha.
# Os horários ficam fora da hora cheia de propósito: é quando o GitHub mais atrasa ou pula os disparos agendados. São
# dois por dia porque um disparo pulado não avisa ninguém: o segundo cobre o primeiro e, se o primeiro já publicou, só
# confere a data e para.
# Também pode ser disparado à mão (Actions -> gerar -> Run workflow), a qualquer momento; à mão, só publica se
# "publish" for marcado; sem isso, gera e confere (os logs, o relatório das travas e as medições ficam nos artefatos).
#
# Medido no Actions (executor de 2 CPUs e 7,7 GiB de RAM; `/usr/bin/time -v` em data/tempo.txt, no artefato): a
# geração publicada 2026-11-10-c17dff60 (run 42796975627) levou 90 min, com pico de RSS de 7.487.172 kB (7,1 GiB) e
# até 7,5 GiB de swap; depois da redução de memória (commits 59c5176, f958a96 e ae20f4f; run 42882573549, sem
# publicar), 75 min e 7.194.332 kB (6,9 GiB, o "pico" do log do build), com até 2,2 GiB de swap. O extrato do Brasil
# tem ~2,3 GB e o pyosmium guarda as coordenadas dos nós na memória (SABIA_NODE_STORAGE muda); por isso o job tem
# swap e registra memória, swap e disco a cada 30 s.
# Essas medições são do executor de repositório privado, pequeno (2 CPUs, 7,7 GiB de RAM, ~14 GB livres em /). O
# repositório é público desde 2026-11-11, e o GitHub dá a repositório público um executor maior (4 CPUs, 16 GB de
# RAM, pela documentação dele), ainda não medido aqui: o swap e a limpeza de disco continuam, que não custam nada se
# sobrar. O job libera espaço apagando ferramentas pré-instaladas e põe os dados e o swap no disco com mais espaço
# livre (/ ou o disco temporário em /mnt, quando a máquina tem um), como os outros geradores do mesmo molde.
name: gerar

on:
  schedule:
    - cron: "47 6 * * *"    # todo dia, 03:47 em Brasília (o job "interval" decide se gera)
    - cron: "47 12 * * *"   # e 09:47 em Brasília, caso o primeiro seja pulado ou falhe
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a release e o catalogo.json no fim. Sem marcar: só gera e confere."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  interval:
    # O agendamento só vale no repositório do projeto: um fork não gera sozinho (à mão, gera onde for disparado).
    if: github.event_name != 'schedule' || github.repository == 'Murkiriel/sabia'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      # A data vem do catalogo.json do checkout, não de raw.githubusercontent.com: lá um repositório privado (este,
      # até 2026-11-11) responde 404, a data sumiria e o job geraria todo dia; e, público, o raw pode servir por
      # alguns minutos o catálogo de antes de uma publicação. O checkout é o do ramo como está agora, não o do
      # commit do disparo: um run que esperou na fila atrás de outro que publicou tem de ler o catálogo novo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Idade da geração publicada
        id: age
        env:
          MANUAL: ${{ github.event_name != 'schedule' && '--manual' || '' }}
          # Geração extra, fora do intervalo: a partir desta data (UTC), gera se a geração publicada for de antes
          # dela (e tenta de novo nos dias seguintes se falhar). Depois de publicar, não tem mais efeito, e os 29
          # dias passam a contar dessa geração. Vazio = só o intervalo.
          GENERATE_FROM: ""
        run: python3 gerador/scripts/due.py $MANUAL --generate-from "$GENERATE_FROM"

  generate:
    needs: interval
    if: needs.interval.outputs.run == 'true'
    # Imagem fixa, não ubuntu-latest: o passo que compila o SQLite 3.22 só foi pensado para a imagem testada.
    runs-on: ubuntu-24.04
    # O máximo de um executor do GitHub, com folga: a geração do Brasil inteiro leva 75 a 90 min (medido acima).
    timeout-minutes: 360
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      SWAP_GB: "12"
    steps:
      - uses: actions/checkout@v7

      - name: Liberar disco
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt 2>/dev/null || df -h /

      - name: Dados e swap no disco com mais espaço
        run: |
          free_gb() { df -BG --output=avail "$1" 2>/dev/null | tail -1 | tr -dc '0-9'; }
          root=$(free_gb /); mnt=$(free_gb /mnt); mnt=${mnt:-0}
          if [ "$mnt" -gt "$root" ]; then base=/mnt; else base="$HOME"; fi
          echo "livre: / ${root} GB, /mnt ${mnt} GB -> dados e swap em ${base}"
          sudo mkdir -p "$base/sabia-data" && sudo chown "$USER" "$base/sabia-data"
          ln -s "$base/sabia-data" gerador/data
          mkdir -p gerador/data/raw
          sudo fallocate -l "${SWAP_GB}G" "$base/swap-sabia"
          sudo chmod 600 "$base/swap-sabia"
          sudo mkswap "$base/swap-sabia" > /dev/null
          sudo swapon "$base/swap-sabia"
          free -h
          df -h / /mnt 2>/dev/null || df -h /
          echo "CPUs: $(nproc)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r gerador/requirements.txt

      - name: SQLite 3.22, o do Android 10, para a trava que abre os bancos nele
        working-directory: gerador
        run: python scripts/install_sqlite.py

      - name: Gerar
        working-directory: gerador
        env:
          # Sem buffer: o log do passo mostra o progresso enquanto roda, não tudo junto no fim.
          PYTHONUNBUFFERED: "1"
        run: |
          ( while true; do
              echo "$(date -u +%H:%M:%S) $(free -m | awk '/Mem:/{print "ram_used_mb="$3} /Swap:/{print "swap_used_mb="$3}' | tr '\n' ' ') data=$(du -sBM data/ 2>/dev/null | cut -f1)"
              sleep 30
            done ) > data/recursos.log 2>&1 &
          /usr/bin/time -v -o data/tempo.txt python generate.py

      - name: Guardar logs e medições
        if: always()
        run: |
          mkdir -p relatorio
          cp gerador/data/recursos.log gerador/data/tempo.txt gerador/data/dist/geracao.json gerador/data/dist/relatorio.json gerador/data/dist/catalogo.json gerador/data/dist/pacotes.json relatorio/ 2>/dev/null || true
          # O corpo das respostas ruins do IBGE, se houve (sabia/sources.py)
          cp gerador/data/raw/*.invalido relatorio/ 2>/dev/null || true
          df -h / /mnt 2>/dev/null || df -h /
          ls -la relatorio

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relatorio-da-geracao
          path: relatorio
          retention-days: 14

      - name: Publicar
        if: env.PUBLISH == 'true'
        working-directory: gerador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish.py --release --commit --push
