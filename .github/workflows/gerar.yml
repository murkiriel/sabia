# Gera uma geração completa (extrato do OpenStreetMap -> bancos por estado e base -> travas -> catálogo) e publica a
# release e o catalogo.json pelo scripts/publish.py, com todas as travas dele.
#
# A cada 29 dias: todo dia, às 03:47 e às 09:47 em Brasília, o job "interval" lê a data da geração publicada
# (built_at do catalogo.json) e só segue para a geração se ela tiver 29 dias ou mais (scripts/due.py). Se a geração
# falhar, o disparo seguinte tenta de novo: a publicada continua com a data velha.
# Os horários ficam fora da hora cheia de propósito: é quando o GitHub mais atrasa ou pula os disparos agendados. São
# dois por dia porque um disparo pulado não avisa ninguém: o segundo cobre o primeiro e, se o primeiro já publicou, só
# confere a data e para.
# Também pode ser disparado à mão (Actions -> gerar -> Run workflow), a qualquer momento; à mão, só publica se
# "publish" for marcado; sem isso, gera e confere (os logs, o relatório das travas e as medições ficam nos artefatos).
#
# Ainda não medido no Actions (fase V1). Os números de referência são de um extrato regional: Goiás e DF em menos de
# 1 min, 0,3 GB em data/. Para o Brasil inteiro, o extrato tem ~2,3 GB e a leitura guarda as coordenadas dos nós na
# memória (SABIA_NODE_STORAGE muda); por isso o job tem swap e registra memória, swap e disco a cada 30 s.
name: gerar

on:
  schedule:
    - cron: "47 6 * * *"    # todo dia, 03:47 em Brasília (o job "interval" decide se gera)
    - cron: "47 12 * * *"   # e 09:47 em Brasília, caso o primeiro seja pulado ou falhe
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a release e o catalogo.json no fim. Sem marcar: só gera e confere."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  interval:
    # O agendamento só vale no repositório do projeto: um fork não gera sozinho (à mão, gera onde for disparado).
    if: github.event_name != 'schedule' || github.repository == 'Murkiriel/sabia'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      # A data vem do catalogo.json do checkout, não de raw.githubusercontent.com: lá um repositório privado
      # responde 404, a data sumiria e o job geraria todo dia. O checkout é o do ramo como está agora, não o do
      # commit do disparo: um run que esperou na fila atrás de outro que publicou tem de ler o catálogo novo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Idade da geração publicada
        id: age
        env:
          MANUAL: ${{ github.event_name != 'schedule' && '--manual' || '' }}
          # Geração extra, fora do intervalo: a partir desta data (UTC), gera se a geração publicada for de antes
          # dela (e tenta de novo nos dias seguintes se falhar). Depois de publicar, não tem mais efeito, e os 29
          # dias passam a contar dessa geração. Vazio = só o intervalo.
          GENERATE_FROM: ""
        run: python3 gerador/scripts/due.py $MANUAL --generate-from "$GENERATE_FROM"

  generate:
    needs: interval
    if: needs.interval.outputs.run == 'true'
    # Imagem fixa, não ubuntu-latest: o passo que compila o SQLite 3.22 só foi pensado para a imagem testada.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      SWAP_GB: "8"
    steps:
      - uses: actions/checkout@v7

      - name: Swap no disco
        run: |
          sudo fallocate -l "${SWAP_GB}G" /swap-sabia
          sudo chmod 600 /swap-sabia
          sudo mkswap /swap-sabia > /dev/null
          sudo swapon /swap-sabia
          free -h
          df -h /
          echo "CPUs: $(nproc)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r gerador/requirements.txt

      - name: SQLite 3.22, o do Android 10, para a trava que abre os bancos nele
        working-directory: gerador
        run: python scripts/install_sqlite.py

      - name: Gerar
        working-directory: gerador
        run: |
          mkdir -p data
          ( while true; do
              echo "$(date -u +%H:%M:%S) $(free -m | awk '/Mem:/{print "ram_used_mb="$3} /Swap:/{print "swap_used_mb="$3}' | tr '\n' ' ') data=$(du -sBM data/ 2>/dev/null | cut -f1)"
              sleep 30
            done ) > data/recursos.log 2>&1 &
          /usr/bin/time -v -o data/tempo.txt python generate.py

      - name: Guardar logs e medições
        if: always()
        run: |
          mkdir -p relatorio
          cp gerador/data/recursos.log gerador/data/tempo.txt gerador/data/dist/geracao.json gerador/data/dist/relatorio.json gerador/data/dist/catalogo.json gerador/data/dist/pacotes.json relatorio/ 2>/dev/null || true
          ls -la relatorio

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relatorio-da-geracao
          path: relatorio
          retention-days: 14

      - name: Publicar
        if: env.PUBLISH == 'true'
        working-directory: gerador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish.py --release --commit --push
